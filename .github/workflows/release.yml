name: Publish Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r Flow.Launcher.Plugin.PearDesktop.zip . -x '*.git*'
      - uses: softprops/action-gh-release@v2
        with:
          files: Flow.Launcher.Plugin.PearDesktop.zip
